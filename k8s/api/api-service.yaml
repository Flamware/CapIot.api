apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: capiot
  labels:
    app: api-service
spec:
  type: NodePort             # 👈 changed from LoadBalancer
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 80               # Cluster port
      targetPort: 8080       # Pod port
      nodePort: 30080        # Optional fixed NodePort (range: 30000–32767)
      name: http-api
