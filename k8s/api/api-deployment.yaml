apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: capiot-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: api
          image: flamware/capiot-api:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: api-secrets
            - configMapRef:
                name: api-configmap
          ports:
            - containerPort: 8080  # Matches Service port
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
