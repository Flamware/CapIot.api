name: Deploy API to Google Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Google Cloud SDK and gke-gcloud-auth-plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker_build
        run: |
          cd api # Navigate to the api directory
          IMAGE_TAG=$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::8}
          docker build --push --no-cache \
            --file Dockerfile \
            --tag flamware/capiot-api:$IMAGE_TAG \
            .
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GKE_CREDENTIALS }}'
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: capiot-eu-cluster
          location: europe-west9
          project_id: awesome-vigil-454917-q7

      - name: Create/Update Flyway Migration ConfigMap
        run: |
          ls
           kubectl create configmap flyway-migration-scripts \
              --namespace=capiot \
              --from-file=${{ github.workspace }}/database/migration \
              --dry-run=client -o yaml | kubectl apply -f -

      - name: Update Kubernetes deployment and YAML
        run: |
          kubectl set image deployment/api-backend-deployment api-backend-container=flamware/capiot-api:${{ steps.docker_build.outputs.image_tag }} -n capiot
          kubectl rollout status deployment/api-backend-deployment -n capiot
          kubectl get deployment api-backend-deployment -n capiot -o yaml > api-backend-deployment.yaml